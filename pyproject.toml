[project]
name = "hypragent"
version = "1.0.0"
description = "Native model-agnostic computer use agent for Hyprland/Wayland"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "anthropic>=0.40",
    "google-generativeai>=0.8",
    "ollama>=0.4",
    "playwright>=1.45",
    "pytesseract>=0.3",
    "Pillow>=10.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "rich>=13.0",
    "pyyaml>=6.0",
    "evdev>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
hypragent = "mcp_server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "wayland: requires a running Wayland session with grim and /dev/uinput access",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "tools"]
