[project]
name = "hypragent"
version = "1.0.0"
description = "Native model-agnostic computer use agent for Hyprland/Wayland"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "anthropic>=0.40",
    "google-generativeai>=0.8",
    "ollama>=0.4",
    "Pillow>=10.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pytesseract>=0.3.13",
]

[project.optional-dependencies]
hyprland = [
    "evdev>=1.6",
    "pytesseract>=0.3",
]
browser = ["playwright>=1.45"]
all = ["hypragent[hyprland,browser]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
hypragent = "mcp_server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "wayland: requires a running Wayland session with grim and /dev/uinput access",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "tools", "harness"]

[tool.hatch.build.targets.wheel.force-include]
"mcp_server.py" = "mcp_server.py"

